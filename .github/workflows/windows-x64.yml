name: Build Windows x64 Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - pomodoro-timer
  pull_request:
    branches:
      - main

jobs:
  build-windows-x64:
    runs-on: windows-2022
    env:
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Show tool versions
        run: |
          node --version
          npm --version
          yarn --version

      - name: Install dependencies
        env:
          npm_config_ignore_scripts: "true"
        run: yarn install --frozen-lockfile --ignore-engines --network-timeout 300000

      - name: Build Windows x64 installer
        run: yarn electron:build --win --x64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeekToDo-Windows-x64-installer
          path: |
            dist_electron/*.exe
            dist_electron/*.blockmap
          if-no-files-found: error
